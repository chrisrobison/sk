<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouth Spritesheet Demo</title>
  <link rel="stylesheet" href="mouth_sprites.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .sprite-demo {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    
    .sprite-item {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      text-align: center;
      width: 150px;
    }
    
    h1, h2 {
      color: #333;
    }
    
    .spritesheet-container {
      margin: 20px 0;
      border: 1px solid #ddd;
      padding: 10px;
    }
    
    .spritesheet-container img {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <h1>Mouth Spritesheet Demo</h1>
  
  <div class="spritesheet-container">
    <h2>Complete Spritesheet</h2>
    <img src="mouths_spritesheet.png" alt="Mouth Spritesheet">
  </div>
  
  <h2>Individual Sprites</h2>
  <div class="sprite-demo">
    <div class="sprite-item">
      <div class="mouth-sprite mouth-a_e_i"></div>
      <p>a_e_i</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-ah"></div>
      <p>ah</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-b_m_p"></div>
      <p>b_m_p</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-c_d_g_K_n_s_t_x_y_z"></div>
      <p>c_d_g_K_n_s_t_x_y_z</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-default"></div>
      <p>default</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-d"></div>
      <p>d</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-e"></div>
      <p>e</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-f"></div>
      <p>f</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-f_w"></div>
      <p>f_w</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-l2"></div>
      <p>l2</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-l"></div>
      <p>l</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-m"></div>
      <p>m</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-oh"></div>
      <p>oh</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-o"></div>
      <p>o</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-o_w"></div>
      <p>o_w</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-r"></div>
      <p>r</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-sc"></div>
      <p>sc</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-s"></div>
      <p>s</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-th"></div>
      <p>th</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-un"></div>
      <p>un</p>
    </div>
    <div class="sprite-item">
      <div class="mouth-sprite mouth-wo"></div>
      <p>wo</p>
    </div>
  </div>
</body>
</html>
